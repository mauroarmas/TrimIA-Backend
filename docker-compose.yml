services:
  postgres:
    image: postgres:16.3-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trimia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trimia}
      POSTGRES_DB: ${POSTGRES_DB:-trimia}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - trimia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trimia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - trimia-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.20
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/chroma/chroma
    environment:
      IS_PERSISTENT: "TRUE"
    networks:
      - trimia-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      # N8N_HOST usa el nombre del servicio para que las URLs internas sean resolubles
      N8N_HOST: n8n
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      # WEBHOOK_URL es la URL que n8n usa para construir los webhooks hacia el exterior
      # En dev: localhost para que las URLs sean accesibles desde browser/Postman
      # En prod: reemplazar por la URL pública (ej. https://n8n.tudominio.com/)
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Argentina/Buenos_Aires
      # La usa el nodo "Transcribir audio (Gemini)" de RecepcionMensaje-A
      # (Sprint 5A, US5): n8n transcribe las notas de voz porque el token de
      # Meta vive solo acá. Sin esta variable el nodo recibe 401 y —por su
      # neverError— todos los audios caen en "no se entendió", en silencio.
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      # Permite leerla como {{ $env.GOOGLE_API_KEY }} desde una expresión: n8n
      # bloquea el acceso a env vars en los nodos por defecto.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # --- FR-011: el audio de una nota de voz no se persiste en ningún lado ---
      # Estas tres van a nivel INSTANCIA y no en el JSON del workflow porque el
      # `saveDataSuccessExecution: none` del workflow NO alcanzó: en la prueba
      # real del 2026-08-18 la nota de voz quedó igual guardada dos veces —el
      # .ogg en disco (modo filesystem) y su base64 dentro de execution_data—.
      # Los settings del workflow son advisory; los de la instancia mandan.
      #
      # `default` = binarios en memoria. Con `filesystem` n8n escribe cada
      # binario a storage/workflows/<id>/executions/<n>/binary_data/.
      N8N_DEFAULT_BINARY_DATA_MODE: default
      # Sin esto, la salida de cada nodo —incluido el base64 del audio— queda
      # en la base de ejecuciones. Se pierde el historial de ejecuciones de
      # n8n para depurar, y es un costo real: la voz de una persona pesa más
      # que la comodidad de ver qué devolvió cada nodo.
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      # Las corridas manuales desde el editor se GUARDAN por defecto, así que
      # sin esto alcanzaba con probar el workflow a mano una vez para volver a
      # dejar el audio en la base. Apagarlo no impide depurar: al ejecutar
      # desde el editor, n8n muestra la salida de cada nodo en vivo sobre el
      # canvas (viene por la conexión push, no de la base) — lo que se pierde
      # es poder volver a abrirla después.
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
    env_file:
      - .env
    volumes:
      - ./n8n/data:/home/node/.n8n
    networks:
      - trimia-net

  nestjs:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://trimia:trimia@postgres:5432/trimia
    env_file:
      - .env
    volumes:
      - .:/app
      - /app/node_modules
    # El volumen anónimo de node_modules persiste entre `docker compose down`
    # y `up` (down sin -v no lo borra) — aísla los módulos nativos (bcrypt)
    # del contenedor Linux de los del host, pero si package.json gana una
    # dependencia nueva ese volumen queda desactualizado y la imagen fresca
    # que construyó `npm ci` en Dockerfile.dev queda tapada. `npm install`
    # acá es idempotente (no reinstala lo que ya está) y sincroniza el
    # volumen contra package.json en cada arranque, sin depender de que
    # alguien lo note y corra `npm install` a mano dentro del contenedor.
    command: sh -c "npm install --no-audit --no-fund && npx prisma generate && npm run start:dev"
    networks:
      - trimia-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy

  # El Panel del Supervisor (gobernanza) NO es un contenedor aparte: es un
  # módulo del frontend React (E4) que consume los endpoints /supervisor/* del
  # backend NestJS. Por eso acá no hay un servicio dedicado.

networks:
  trimia-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  chroma_data:
  pgadmin_data:
